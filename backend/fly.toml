# Fly.io app configuration for the backend API
# Update 'app' with your Fly app name (e.g., apexinvest-backend)

app = "apexinvest-backend-placeholder"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.backend"

[env]
  BACKEND_HOST = "0.0.0.0"
  BACKEND_PORT = "8000"

[[services]]
  internal_port = 8000
  processes = ["app"]
  protocol = "tcp"

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    soft_limit = 20
    hard_limit = 40

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "30s"
    method = "get"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[http_service]
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

