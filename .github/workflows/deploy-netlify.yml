name: Deploy Frontend to Netlify

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve backend URL
        env:
          SECRET_BACKEND_URL: ${{ secrets.REACT_APP_BACKEND_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${SECRET_BACKEND_URL}" ]; then
            echo "Using REACT_APP_BACKEND_URL from secret"
            echo "REACT_APP_BACKEND_URL=${SECRET_BACKEND_URL}" >> $GITHUB_ENV
            exit 0
          fi
          if [ -n "${RENDER_API_KEY}" ] && [ -n "${RENDER_SERVICE_ID}" ]; then
            echo "Fetching backend URL from Render API"
            RESP=$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}")
            # Try common fields for the public URL
            URL=$(echo "$RESP" | jq -r '.serviceDetails.url // .url // .dashboardUrl // empty')
            if [ -z "$URL" ] || [[ "$URL" != http* ]]; then
              # Try custom domains endpoint
              DOMAINS=$(curl -fsSL -H "Authorization: Bearer ${RENDER_API_KEY}" "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/custom-domains" || true)
              HOST=$(echo "$DOMAINS" | jq -r '.[0].name // empty')
              if [ -n "$HOST" ]; then URL="https://$HOST"; fi
            fi
            if [ -n "$URL" ]; then
              echo "Resolved backend URL: $URL"
              echo "REACT_APP_BACKEND_URL=$URL" >> $GITHUB_ENV
              exit 0
            fi
            echo "Could not resolve backend URL from Render API." >&2
            exit 1
          fi
          echo "REACT_APP_BACKEND_URL secret not set and no Render API secrets provided." >&2
          exit 1

      - name: Install dependencies (ci with fallback)
        run: |
          set -e
          npm --version
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed; falling back to npm install"
            npm install --no-audit --no-fund
          fi

      - name: Resolve Netlify Site ID
        env:
          NETLIFY_SITE_ID_SECRET: ${{ secrets.NETLIFY_SITE_ID }}
          SITE_ID_SECRET: ${{ secrets.SITE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${NETLIFY_SITE_ID_SECRET}" ]; then
            echo "Using NETLIFY_SITE_ID from secret"
            echo "NETLIFY_SITE_ID=${NETLIFY_SITE_ID_SECRET}" >> $GITHUB_ENV
          elif [ -n "${SITE_ID_SECRET}" ]; then
            echo "Using SITE_ID secret as NETLIFY_SITE_ID"
            echo "NETLIFY_SITE_ID=${SITE_ID_SECRET}" >> $GITHUB_ENV
          else
            echo "NETLIFY_SITE_ID secret missing (and SITE_ID fallback not provided)." >&2
            exit 1
          fi

      - name: Build React app
        env:
          REACT_APP_BACKEND_URL: ${{ env.REACT_APP_BACKEND_URL }}
        run: npm run build

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ env.NETLIFY_SITE_ID }}
        run: netlify deploy --dir=build --prod --message "GitHub Actions deploy"
