apiVersion: apps/v1
kind: Deployment
metadata:
  name: apexinvest-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apexinvest-backend
  template:
    metadata:
      labels:
        app: apexinvest-backend
    spec:
      containers:
        - name: backend
          # Build and push your own image based on backend/Dockerfile,
          # which includes the dataset and model.  Example:
          # image: your-dockerhub-username/apexinvest-backend:latest
          image: apexinvest-backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_URI
              value: postgresql://apexinvest:apexinvest@postgres:5432/apexinvest_db
            - name: MONGODB_URI
              value: mongodb://apexinvest:apexinvest@mongodb:27017/apexinvest_db
            - name: REDIS_URI
              value: redis://redis:6379/0
            - name: ALPHA_VANTAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: alphaVantage
            - name: NEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: external-api-keys
                  key: newsApi
          # Liveness and readiness probes
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apexinvest-backend
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: apexinvest-backend