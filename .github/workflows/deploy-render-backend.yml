name: Trigger Render Backend Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger via Deploy Hook (preferred)
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"

      - name: Trigger via Render API (fallback)
        if: env.RENDER_DEPLOY_HOOK == '' && env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != ''
        run: |
          curl -fsSL -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'

      - name: Missing secrets
        if: env.RENDER_DEPLOY_HOOK == '' && (env.RENDER_API_KEY == '' || env.RENDER_SERVICE_ID == '')
        run: |
          echo "Set RENDER_DEPLOY_HOOK or both RENDER_API_KEY and RENDER_SERVICE_ID in GitHub Secrets." >&2
          exit 1

